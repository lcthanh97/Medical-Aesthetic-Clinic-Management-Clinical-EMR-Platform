
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-clinic-app
    restart: unless-stopped

    ports:
      - "${HOST_PORT:-3000}:3000"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000

    command: ["npm", "run", "start"]
